name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit-test:
    name: unit-test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: caramel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test -d caramel_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/caramel_test
      SPRING_DATASOURCE_USERNAME: test
      SPRING_DATASOURCE_PASSWORD: test
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    defaults:
      run:
        working-directory: CaramelStray
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U test -d caramel_test && exit 0
            echo "Waiting for postgres..."
            sleep 2
          done
          echo "PostgreSQL did not become ready in time."
          exit 1

      - name: Run unit tests and generate JaCoCo report
        run: mvn -B clean test jacoco:report

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            CaramelStray/target/surefire-reports
            CaramelStray/target/site/jacoco/jacoco.xml
          if-no-files-found: warn

  static-analysis:
    name: static-analysis
    runs-on: ubuntu-latest
    needs: unit-test
    defaults:
      run:
        working-directory: CaramelStray
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Download JaCoCo artifact
        uses: actions/download-artifact@v4
        with:
          name: unit-test-reports
          path: CaramelStray/.artifacts/unit-test

      - name: Restore JaCoCo report path
        shell: bash
        run: |
          mkdir -p target/site/jacoco
          JACOCO=$(find "$GITHUB_WORKSPACE/CaramelStray/.artifacts" -type f -name jacoco.xml -print -quit 2>/dev/null || true)
          if [ -n "$JACOCO" ]; then
            cp "$JACOCO" target/site/jacoco/jacoco.xml
            echo "Copied jacoco report from $JACOCO"
          else
            echo "No jacoco.xml found in downloaded artifacts. Listing files for debugging:"
            find "$GITHUB_WORKSPACE/CaramelStray/.artifacts" -maxdepth 5 -type f -print || true
            exit 1
          fi

      - name: Compile project for SonarCloud
        run: mvn -B -DskipTests compile

      - name: Run SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B
          -DskipTests
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar

  system-test:
    name: system-test
    runs-on: ubuntu-latest
    needs: static-analysis
    defaults:
      run:
        working-directory: CaramelStray
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run E2E system tests
        run: mvn -B test-compile failsafe:integration-test failsafe:verify

      - name: Upload system test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-test-reports
          path: |
            CaramelStray/target/failsafe-reports
            CaramelStray/target/surefire-reports
          if-no-files-found: warn
