name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit-test:
    name: unit-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CaramelStray
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run unit tests and generate JaCoCo report
        run: mvn -B clean test jacoco:report

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            CaramelStray/target/surefire-reports
            CaramelStray/target/site/jacoco/jacoco.xml
          if-no-files-found: warn

  static-analysis:
    name: static-analysis
    runs-on: ubuntu-latest
    needs: unit-test
    defaults:
      run:
        working-directory: CaramelStray
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Download JaCoCo artifact
        uses: actions/download-artifact@v4
        with:
          name: unit-test-reports
          path: CaramelStray/.artifacts/unit-test

      - name: Restore JaCoCo report path
        shell: bash
        run: |
          mkdir -p target/site
          if [ -f .artifacts/unit-test/jacoco.xml ]; then
            mkdir -p target/site/jacoco
            cp .artifacts/unit-test/jacoco.xml target/site/jacoco/jacoco.xml
          fi

      - name: Compile project for SonarCloud
        run: mvn -B -DskipTests compile

      - name: Run SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B
          -DskipTests
          -Dsonar.qualitygate.wait=true
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar

  system-test:
    name: system-test
    runs-on: ubuntu-latest
    needs: static-analysis
    defaults:
      run:
        working-directory: CaramelStray
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run E2E system tests
        run: mvn -B test-compile failsafe:integration-test failsafe:verify

      - name: Upload system test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-test-reports
          path: |
            CaramelStray/target/failsafe-reports
            CaramelStray/target/surefire-reports
          if-no-files-found: warn
